<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>All Books</title>
  <link rel="stylesheet" href="../static/css/style.css">
  <script src="https://unpkg.com/htmx.org@1.9.2"></script>
</head>
<body>
<div class="container">
  <h1 class="title">All Books</h1>

  <div id="feedback" class="feedback"></div>

  <ul class="book-list">
    {{- if . }}
    {{- range . }}
    <li class="book-item">
      <div class="book-info">
        <strong>{{ .Title }}</strong>
        <em>({{ .PublicationYear }})</em>
        <div>Authors: {{ join .Authors ", " }}</div>
        <div>Genres:  {{ join .Genres  ", " }}</div>
      </div>
      <form
              hx-post="/add-to-list"
              hx-target="#feedback"
              hx-swap="innerHTML"
              class="add-form"
      >
        <input type="hidden" name="book_id" value="{{ .ID }}">
        <button type="submit" class="btn small-btn">
          Add to My List
        </button>
      </form>
    </li>
    {{- end }}
    {{- else }}
    <li class="book-item">No books available.</li>
    {{- end }}
  </ul>

  <div class="nav-links">
    <a href="/myList">My Book List</a>
    <a href="/request">Request Book</a>
    <a href="/profile">Profile</a>
    <a href="/logout">Logout</a>
  </div>
</div>
</body>
</html>
